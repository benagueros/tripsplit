<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14161a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="TripSplit — split trip expenses with your group. No accounts, just share the link."
    />
    <!-- Link previews (Open Graph / Twitter Card). Static: trip links carry the
         token in the URL fragment, which never reaches the server, so every
         link unfurls this same card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TripSplit" />
    <meta property="og:title" content="TripSplit — Snap. Claim. Settled." />
    <meta
      property="og:description"
      content="Share one link in the group chat and you're done. Split the bill, not the friendship."
    />
    <meta property="og:url" content="https://tripsplit.us/" />
    <meta property="og:image" content="https://tripsplit.us/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TripSplit — Snap. Claim. Settled." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TripSplit — Snap. Claim. Settled." />
    <meta
      name="twitter:description"
      content="Share one link in the group chat and you're done. Split the bill, not the friendship."
    />
    <meta name="twitter:image" content="https://tripsplit.us/og-image.png" />
    <title>TripSplit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
